services:
  postgres:
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stock_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-stock_platform}"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - stock_platform_postgres:/home/postgres/pgdata/data

  redis:
    image: redis:8-alpine
    profiles: ["future"]

  minio:
    image: minio/minio:latest
    command: server /data
    profiles: ["future"]

volumes:
  stock_platform_postgres:
    name: ai_stock_m0_postgres

