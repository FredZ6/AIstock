name: Weekly Evaluation

on:
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENVIRONMENT: fixture
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install locked Python dependencies
        run: uv sync --frozen
      - name: Run frozen release evaluation
        run: uv run python scripts/run_offline_eval.py --dataset evals/datasets --baseline evals/baselines/eval-v0.2.0.json --output reports/evaluation/weekly
      - name: Detect configured provider credentials
        id: provider_credentials
        env:
          ALPACA_DATA_KEY: ${{ secrets.ALPACA_DATA_KEY }}
          ALPACA_DATA_SECRET: ${{ secrets.ALPACA_DATA_SECRET }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          test -n "$SEC_USER_AGENT" && echo "sec=true" >> "$GITHUB_OUTPUT" || echo "sec=false" >> "$GITHUB_OUTPUT"
          test -n "$ALPACA_DATA_KEY" && test -n "$ALPACA_DATA_SECRET" && echo "alpaca=true" >> "$GITHUB_OUTPUT" || echo "alpaca=false" >> "$GITHUB_OUTPUT"
          test -n "$ALPHA_VANTAGE_API_KEY" && echo "alpha=true" >> "$GITHUB_OUTPUT" || echo "alpha=false" >> "$GITHUB_OUTPUT"
      - name: SEC provider smoke when configured
        if: steps.provider_credentials.outputs.sec == 'true'
        env:
          LIVE_PROVIDER_TESTS: "1"
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: uv run pytest backend/tests/contract/providers/test_live_adapter_contracts.py -m live -k sec -q
      - name: Report skipped SEC provider smoke
        if: steps.provider_credentials.outputs.sec != 'true'
        run: echo "SKIP SEC live smoke - SEC_USER_AGENT is not configured"
      - name: Alpaca market-data smoke when configured
        if: steps.provider_credentials.outputs.alpaca == 'true'
        env:
          LIVE_PROVIDER_TESTS: "1"
          ALPACA_DATA_KEY: ${{ secrets.ALPACA_DATA_KEY }}
          ALPACA_DATA_SECRET: ${{ secrets.ALPACA_DATA_SECRET }}
        run: uv run pytest backend/tests/contract/providers/test_live_adapter_contracts.py -m live -k alpaca -q
      - name: Report skipped Alpaca provider smoke
        if: steps.provider_credentials.outputs.alpaca != 'true'
        run: echo "SKIP Alpaca live smoke - market-data credentials are not configured"
      - name: Alpha Vantage provider smoke when configured
        if: steps.provider_credentials.outputs.alpha == 'true'
        env:
          LIVE_PROVIDER_TESTS: "1"
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: uv run pytest backend/tests/contract/providers/test_alpha_vantage_ingestion.py -m live -k alpha_live_contract -q
      - name: Report skipped Alpha Vantage provider smoke
        if: steps.provider_credentials.outputs.alpha != 'true'
        run: echo "SKIP Alpha Vantage live smoke - ALPHA_VANTAGE_API_KEY is not configured"
      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weekly-evaluation
          path: reports/evaluation/weekly
