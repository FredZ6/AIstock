name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENVIRONMENT: fixture
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:55432/stock_platform
      REDIS_URL: redis://localhost:56379/0
      MINIO_ENDPOINT: localhost:59000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: fixture-raw
      MINIO_SECURE: "false"
      POSTGRES_DB: stock_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      NEXT_TELEMETRY_DISABLED: "1"
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: make bootstrap

      - name: Start fixture services
        run: docker compose up -d --wait postgres redis minio

      - name: Upgrade fresh database
        run: uv run alembic -c backend/alembic.ini upgrade head

      - name: Run authoritative verification
        run: make verify

      - name: Show service diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Stop fixture services
        if: always()
        run: docker compose down --volumes --remove-orphans
