[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-stock-research-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "celery>=5.5,<6",
  "fastapi>=0.116,<1",
  "langgraph>=0.6,<2",
  "mcp>=1.13,<2",
  "minio>=7.2,<8",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "prometheus-client>=0.22,<1",
  "redis>=6,<7",
  "sqlalchemy>=2.0,<3",
  "websockets>=15,<16",
]

[tool.setuptools]
package-dir = {"" = "backend/src"}

[tool.setuptools.packages.find]
where = ["backend/src"]
include = ["stock_platform*"]

[dependency-groups]
dev = [
  "hypothesis>=6.138,<7",
  "httpx2>=2,<3",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]
markers = ["live: requires LIVE_PROVIDER_TESTS=1, credentials, and provider network access"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/src", "backend/tests", "scripts/demo_scenario.py"]
